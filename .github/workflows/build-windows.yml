name: Windows 빌드

on:
  workflow_dispatch:  # GitHub 웹에서 수동 실행

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          ref: claude/proma-repo-analysis-edwwjn

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm install
        run: npm install

      - name: Tauri 빌드
        run: npm run tauri build

      - name: 설치파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: proma-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 90
